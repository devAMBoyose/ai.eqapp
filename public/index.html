<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Quake Alert PH (MVP)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="style.css">



</head>
<body>
  <header>
    <h1>Quake Alert PH (MVP)</h1>
    <p>Live quakes feed + nearby alerts. Allow location for best results.</p>
  </header>

  <section class="controls">
    <label>
      Alert radius (km):
      <input id="radiusKm" type="number" min="10" max="1000" step="10" value="200">
    </label>
    <label>
      Min magnitude:
      <input id="minMag" type="number" min="1" max="10" step="0.1" value="4.5">
    </label>
    <button id="testBeep">Test Alert Sound</button>
  </section>

  <section id="status">Requesting your location…</section>

  <section>
    <h2>Recent events</h2>
    <ul id="events"></ul>
  </section>

  <audio id="beep" preload="auto">
    <source src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABYA…" type="audio/wav">
    <!-- tiny embedded beep; replace with your own mp3 if you like -->
  </audio>

  <input id="lat" type="number" step="0.0001" placeholder="Lat (e.g., 14.5995)" />
<input id="lon" type="number" step="0.0001" placeholder="Lon (e.g., 120.9842)" />
<button id="use-manual">Use manual location</button>
<span id="status">Requesting your location...</span>


  <script src="app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/ai.eqapp/main.js"></script>
</body>
</html>
